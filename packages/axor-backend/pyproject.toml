[project]
name = "axor-backend"
version = "0.1.0"
description = "FastAPI backend: trace ingest, control plane (SSE+POST), replay API, GraphStore."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "axor-core>=0.10,<0.11",
  "axor-eval>=0.1.0,<0.2",
  "fastapi>=0.111", "sse-starlette>=2.1", "uvicorn>=0.29",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29",
  "kuzu>=0.4",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pynacl>=1.5",
]

[project.optional-dependencies]
# Wrap engine for /v1/wrap (scan agent code -> tool manifests / governance).
# Not yet on PyPI; install locally with `uv pip install -e ../axor-wrap` (the
# routes answer 501 when it is absent).
wrap = ["axor-wrap>=0.1"]

[project.urls]
Homepage = "https://github.com/Bucha11/axor-control-plane"
Documentation = "https://github.com/Bucha11/axor-control-plane#readme"
Issues = "https://github.com/Bucha11/axor-control-plane/issues"

[project.scripts]
axor-license = "axor_backend.ee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
