[project]
name = "axor-backend"
version = "0.1.0"
description = "FastAPI backend: trace ingest, control plane (SSE+POST), replay and provenance API."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # 0.11 is the first release carrying `policy.from_record` and the shared
  # taint-floor vectors: the incident export decides with the kernel's own gate
  # now, and reads the recorded event through the kernel's own decoder. Neither
  # is mirrored here — a copy of a decoder is how a copy of a decision starts.
  "axor-core>=0.11,<0.12",
  # 0.1.1 is the first release resolvable against axor-core 0.10.
  "axor-eval>=0.1.1,<0.2",
  # Attestation semantics — append-only, revocation-as-an-event, same-keyset
  # revocation, the required reason. Imported, not restated: a plane that
  # decided for itself what a valid attestation is would be a second answer to
  # a question Sentinel already answers.
  "axor-sentinel>=0.3.1,<0.4",
  "fastapi>=0.111", "sse-starlette>=2.1", "uvicorn>=0.29",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pynacl>=1.5",
]

[project.optional-dependencies]
# Wrap engine for /v1/wrap (scan agent code -> tool manifests / governance).
# The routes answer 501 when the extra is absent.
wrap = ["axor-wrap>=0.1,<0.2"]
# Accepting axor-identity login tokens. Absent, identity login is simply off
# (operator master token + scoped API keys still work); the routes never 501
# — resolve_principal only reaches the verifier when a JWKS is configured.
identity = ["pyjwt[crypto]>=2.8", "cryptography>=50.0.0"]

[project.urls]
Homepage = "https://github.com/Bucha11/axor-control-plane"
Documentation = "https://github.com/Bucha11/axor-control-plane#readme"
Issues = "https://github.com/Bucha11/axor-control-plane/issues"

[project.scripts]
axor-license = "axor_backend.ee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
