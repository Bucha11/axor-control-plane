[project]
name = "axor-proxy"
version = "0.1.0"
description = "Observe-only tool proxy: passthrough auth, fault injection, trace recording."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["axor-core>=0.9.1,<0.10", "axor-eval>=0.1.0,<0.2", "httpx>=0.27", "anyio>=4.0", "starlette>=0.37", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/Bucha11/axor-control-plane"
Documentation = "https://github.com/Bucha11/axor-control-plane#readme"
Issues = "https://github.com/Bucha11/axor-control-plane/issues"

[project.scripts]
axor-proxy = "axor_proxy.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["axor-backend"]

[tool.uv.sources]
axor-backend = { workspace = true }
