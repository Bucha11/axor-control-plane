[project]
name = "axor-proxy"
version = "0.1.0"
description = "Observe-only tool proxy: passthrough auth, fault injection, trace recording."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
# axor-wrap[plane] carries the control-plane client (PlaneSession/PlaneClient/
# PlaneAdmission). It used to be axor-core[plane]; the kernel now keeps only the
# primitives the plane steers through, so it can no longer depend on a client.
dependencies = [
  # Held at <0.11 while axor-backend, in this same workspace, moved to >=0.11 —
  # so the two intersected NOWHERE and `uv sync` answered "your workspace's
  # requirements are unsatisfiable". A repository that could not install itself.
  #
  # Only the ceiling moves. This proxy imports nothing 0.11 added (the kernel's
  # cross-boundary schemas, `policy.from_record`, the shared vectors — backend
  # and Lab do, which is why THEIR floor is 0.11), and 110 tests pass against
  # it. Raising the floor too would drop 0.10.x for no reason anyone can point
  # at. No test here looked at the installed kernel, so the staleness was
  # silent — tests/test_core_compatibility.py now does.
  "axor-core>=0.10,<0.12",
  "axor-wrap[plane]>=0.1.0,<0.2",
  # 0.2 carries `audit.from_trace`: this proxy reads its cases off the trace it
  # recorded, with the same derivation the control plane runs over the uploaded
  # run, instead of calling the audit layers from its own run state.
  "axor-eval>=0.2,<0.3",
  "httpx>=0.27",
  # Sealed boxes (X25519 + XSalsa20-Poly1305) for envelope-mode credentials:
  # the node opens what the plane stores and cannot. `cryptography`, which
  # arrives with axor-wrap[plane], has no sealed-box primitive.
  "pynacl>=1.5",
  "anyio>=4.0",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/Bucha11/axor-control-plane"
Documentation = "https://github.com/Bucha11/axor-control-plane#readme"
Issues = "https://github.com/Bucha11/axor-control-plane/issues"

[project.scripts]
axor-proxy = "axor_proxy.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["axor-backend"]

[tool.uv.sources]
axor-backend = { workspace = true }