[project]
name = "axor-identity"
version = "0.1.0"
description = "Shared login/identity service: users, orgs, memberships; issues EdDSA-signed session tokens the Lab and control-plane verify."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.111", "uvicorn>=0.29",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "aiosqlite>=0.20",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.8",
  # >=50 avoids PYSEC-2026-3552 (flagged by the pip-audit CI gate on 49.0.0)
  "cryptography>=50.0.0",
  "pydantic[email]>=2.0",
]

[project.urls]
Homepage = "https://github.com/Bucha11/axor-control-plane"

[project.scripts]
axor-identity = "axor_identity.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
