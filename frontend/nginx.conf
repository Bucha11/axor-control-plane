# The single entry point (http://localhost:8080). Serves the built SPA + the
# static demo page, and reverse-proxies the two backends so the browser talks to
# one origin — same routing the Vite dev server does (/v1 -> backend, /axor ->
# proxy). SSE endpoints get buffering off so the live audit stream flows.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Backend API + control plane.
    location /v1/ {
        proxy_pass http://backend:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE: /v1/runs/{id}/stream, /v1/plane/{id}/desired
        proxy_read_timeout 3600s;
    }

    # Observe-only proxy (runs, simulate, preflight).
    location /axor/ {
        proxy_pass http://proxy:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # The standalone demo page (its own entry, per architecture section 7).
    location = /demo.html {
        try_files /demo.html =404;
    }

    # SPA: hash-routed, so everything else falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
