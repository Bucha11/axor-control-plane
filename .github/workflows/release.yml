name: Release

# Tag vX.Y.Z → build + publish the platform packages to PyPI and the compose
# images to GHCR. Credential-free by design:
# - PyPI uses Trusted Publishing (OIDC): configure this repo + workflow as a
#   trusted publisher on pypi.org for axor-proxy and axor-backend once; no
#   API token ever lives in the repo. Full walkthrough: docs/RELEASING.md.
#   The ecosystem deps (axor-core, axor-eval) are already on PyPI, so the two
#   platform packages install cleanly on a fresh machine — verified in
#   docs/RELEASING.md's clean-room check.
# - GHCR uses the workflow's own GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One leg per package. PyPI Trusted Publishing keys on
  # (owner, repo, workflow-file, environment); a *pending* publisher config must
  # be unique, so two packages published from the same workflow need a DISTINCT
  # environment each — otherwise the second registration collides with the first
  # ("already registered for a different project name"). Each leg builds only its
  # own package into dist/ and publishes just that.
  pypi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: axor-proxy
            environment: pypi-proxy
          - pkg: axor-backend
            environment: pypi-backend
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Build ${{ matrix.pkg }} (sdist + wheel)
        run: uv build --package ${{ matrix.pkg }} -o dist/
      - name: Publish ${{ matrix.pkg }} to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend/proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/axor-platform:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/axor-platform:latest
          secrets: |
            github_token=${{ secrets.AXOR_ECOSYSTEM_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/axor-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/axor-frontend:latest
