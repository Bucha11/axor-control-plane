name: Release

# Tag vX.Y.Z → build + publish the platform packages to PyPI and the compose
# images to GHCR (`:X.Y.Z` + `:latest`). A push to main publishes `:edge`
# images only, so the build-free quickstart works between releases.
# Credential-free by design — in both directions: nothing is needed to publish,
# and nothing is needed to build what gets published:
# - PyPI uses Trusted Publishing (OIDC): configure this repo + workflow as a
#   trusted publisher on pypi.org for axor-proxy and axor-backend once; no
#   API token ever lives in the repo. Full walkthrough: docs/RELEASING.md.
#   The ecosystem deps (axor-core, axor-eval, axor-probe, axor-sentinel,
#   axor-wrap) are already on PyPI, so the two platform packages — and the
#   images below — install cleanly on a fresh machine with no token at all.
#   Verified in docs/RELEASING.md's clean-room check.
# - GHCR uses the workflow's own GITHUB_TOKEN.
on:
  push:
    # Tags publish a release: PyPI wheels + `:X.Y.Z` and `:latest` images.
    tags: ["v*"]
    # main publishes `:edge` images only — so the build-free quickstart
    # (`docker compose pull`) has something to pull between releases, instead of
    # pointing newcomers at a tag that does not exist yet.
    branches: [main]
  workflow_dispatch:

jobs:
  # One leg per package. PyPI Trusted Publishing keys on
  # (owner, repo, workflow-file, environment); a *pending* publisher config must
  # be unique, so two packages published from the same workflow need a DISTINCT
  # environment each — otherwise the second registration collides with the first
  # ("already registered for a different project name"). Each leg builds only its
  # own package into dist/ and publishes just that.
  pypi:
    # Wheels are cut by a tag and only by a tag; a push to main publishes images.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: axor-proxy
            environment: pypi-proxy
          - pkg: axor-backend
            environment: pypi-backend
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # Without this, a tag that does not match the package version is the
      # quietest failure in the repository. `uv build` builds whatever pyproject
      # says, and `skip-existing` below then skips it as already-published — so
      # the job goes GREEN having released nothing. Measured: v0.1.1 and v0.1.2
      # both ran green and PyPI stayed on 0.1.0, because nobody had bumped
      # either package. Two releases evaporated behind a checkmark.
      #
      # One tag publishes both packages, so both must carry the tag's version.
      # Every sibling repository (core, wrap, eval, probe, sentinel) has this
      # check; this one did not.
      - name: Verify tag matches ${{ matrix.pkg }} version
        run: |
          python - << 'EOF'
          import pathlib
          import re
          import sys
          import tomllib

          ref = "${{ github.ref_name }}"
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if not m:
              print(f"Tag {ref!r} must match vX.Y.Z")
              sys.exit(1)
          tag_version = m.group(1)

          pkg = "${{ matrix.pkg }}"
          path = pathlib.Path("packages") / pkg / "pyproject.toml"
          data = tomllib.loads(path.read_text(encoding="utf-8"))
          pkg_version = data["project"]["version"]

          if tag_version != pkg_version:
              print(
                  f"Version mismatch: tag={tag_version}, {path}={pkg_version}.\n"
                  f"One tag releases every package in this workspace, so each "
                  f"must be bumped to the tag's version before tagging. "
                  f"Publishing would otherwise skip silently as already-released."
              )
              sys.exit(1)
          print(f"Version check passed: {pkg} {pkg_version}")
          EOF

      - name: Build ${{ matrix.pkg }} (sdist + wheel)
        run: uv build --package ${{ matrix.pkg }} -o dist/
      - name: Publish ${{ matrix.pkg }} to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A re-run (e.g. re-tag to pick up an images fix) then skips an
          # already-published version instead of failing the whole workflow.
          # Safe now that the version check above runs first: skipping can only
          # mean "this exact release already went out", never "the tag and the
          # package disagree and nobody noticed".
          skip-existing: true

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      # GHCR repository names must be lowercase; the owner login (e.g. "Bucha11")
      # is not, so lowercase it before it lands in an image tag.
      - name: Lowercase image owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A tag yields `:X.Y.Z` + `:latest`; a push to main yields `:edge`. Both
      # are what docker-compose.yml resolves ${AXOR_TAG} against, so the
      # build-free path in the README is never a promise of an image that was
      # never pushed.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.owner }}/axor-platform
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Frontend image tags
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.owner }}/axor-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      # No `secrets:` input on either build. These images are what a newcomer
      # runs instead of building, so they must be buildable by anyone — the old
      # `github_token=` secret fetched private git deps that have been published
      # PyPI releases for several releases now.
      - name: Push backend/proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
