name: Deploy

# Rolls the production stack (deploy/prod) forward on the server over SSH:
# pull this repo, pull the images, recreate what changed.
#
# Two ways in. Manually, with the tags to roll to — a deploy stays a decision
# you can make on its own. And automatically after Release finishes a TAG
# successfully, which is the only moment the images that tag names actually
# exist on GHCR. Chaining on Release rather than on the tag push is what keeps
# the server from pulling a version that is still building.
#
# The `production` environment below is the brake: give it a required reviewer
# in Settings and the automatic run waits for a human before it touches the
# server. Without one, a tag deploys itself.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server hostname or IP
#   DEPLOY_USER     SSH user that can run docker (e.g. `deploy`, in the docker group)
#   DEPLOY_SSH_KEY  private key for that user (ed25519, no passphrase)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>` — pins the host key
# The server keeps its checkout at /opt/axor and its secrets in
# /opt/axor/deploy/prod/.env (never in this repo).
on:
  workflow_dispatch:
    inputs:
      axor_tag:
        description: "Control Plane image tag (empty = keep .env value)"
        required: false
      lab_tag:
        description: "Lab image tag (empty = keep .env value)"
        required: false
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    # Only a Release that ran for a TAG. Release also runs on every push to
    # main (it publishes `:edge` images); without this filter each of those
    # started a Deploy that the guard below then skipped — a grey run on
    # every commit that reads like a failure. For a tag push, head_branch is
    # the tag name, so this matches `v0.4.0` and never `main`.
    branches: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A Release run on main publishes `:edge` images only and must not deploy;
    # a failed one must not either. Only a tag that finished successfully.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          AXOR_TAG_IN: ${{ inputs.axor_tag }}
          LAB_TAG_IN: ${{ inputs.lab_tag }}
          RELEASED_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          # After a Release, roll to exactly the version that was just published.
          # `v0.4.0` names the tag; the images and .env carry it without the v.
          # Lab is deliberately not touched: it versions on its own schedule, and
          # a Control Plane release says nothing about which Lab belongs beside
          # it.
          if [ -n "${RELEASED_REF:-}" ] && [ -z "$AXOR_TAG_IN" ]; then
            AXOR_TAG_IN="${RELEASED_REF#v}"
          fi
          # The tags are spliced into a remote shell command: allow only what
          # an image tag can contain.
          for t in "$AXOR_TAG_IN" "$LAB_TAG_IN"; do
            case "$t" in *[!A-Za-z0-9._-]*) echo "invalid tag: $t"; exit 1;; esac
          done
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "AXOR_TAG_IN='$AXOR_TAG_IN' LAB_TAG_IN='$LAB_TAG_IN' sh -eu" <<'EOF'
          cd /opt/axor
          git pull --ff-only
          cd deploy/prod
          [ -n "$AXOR_TAG_IN" ] && sed -i "s/^AXOR_TAG=.*/AXOR_TAG=$AXOR_TAG_IN/" .env
          [ -n "$LAB_TAG_IN" ] && sed -i "s/^LAB_TAG=.*/LAB_TAG=$LAB_TAG_IN/" .env
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          EOF
