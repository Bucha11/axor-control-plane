name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run when a new axor-core is published: the backend, proxy and the
  # ecosystem deps resolve against it, so a release can change the stack.
  # axor-core's publish job fans this out.
  repository_dispatch:
    types: [axor-core-published]
  workflow_dispatch:

jobs:
  # ── Python: lint + unit + backend E2E (real backend/proxy subprocesses) ──────
  python:
    runs-on: ubuntu-latest
    # The suite runs on SQLite; production runs on Postgres. Until this service
    # existed the only thing that ever touched Postgres was the deploy job's
    # three-route smoke, which does not run on pull requests — so the second
    # dialect was a claim, and the first thing it cost was a migration that
    # passed every test and could not be applied to the production database at
    # all (Postgres does not rename a table's constraints when the table is
    # renamed; SQLite has no such rule). `-m postgres` closes that gap.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: axor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXOR_TEST_POSTGRES_URL: postgresql+asyncpg://axor:ci@127.0.0.1:5432/axor_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # No "Authorize ecosystem git deps" step: pyproject's [tool.uv.sources]
      # says the git-ref era is over — every ecosystem dependency resolves from
      # PyPI and `uv.lock` holds zero git sources. The step it replaced wrote a
      # global `insteadOf` rewrite with a PAT on every job, for dependencies
      # that no longer exist. The Dockerfile's build-time secret was left in
      # place at the time, as a no-op "conditional on the secret being present"
      # — except compose declared it required, so the no-op was the quickstart's
      # first command asking a stranger for a PAT. It is gone now, and the
      # `quickstart` job below keeps it gone.
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      # `pytest` collects the backend E2E suite too — it boots the real backend
      # and proxy as subprocesses (marker `e2e`). Run it explicitly first so a
      # failure there is legible, then the whole suite.
      - name: Backend E2E
        run: uv run pytest -q -m e2e
      # Named separately so a dialect failure is legible as one, rather than
      # arriving inside a 300-test run.
      - name: Postgres dialect
        run: uv run pytest -q -m postgres
      - name: Tests
        run: uv run pytest -q

  # ── Frontend: typecheck + build + Playwright E2E (boots the whole stack) ─────
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # The Playwright webServer boots the real backend + proxy (`uv run`), so
      # the Python workspace must be installed.
      - name: Sync workspace
        run: uv sync --all-packages
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # `pnpm build` runs `tsc -b` first, so a type error fails the job here.
      - name: Typecheck + build
        working-directory: frontend
        run: pnpm build
      - name: Playwright E2E
        working-directory: frontend
        run: pnpm e2e
        env:
          CI: "1"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ── Quickstart: the stranger's build, with nothing in the environment ───────
  # The one thing a PR may never reintroduce. The ecosystem deps were private
  # git refs once; when they moved to PyPI the Dockerfile's `github_token`
  # BuildKit secret stayed behind, and the quickstart of a public repository
  # went on demanding a PAT only the owner could issue. It stayed green the
  # whole time, because the one job that built an image was handed a token.
  #
  # This job is handed nothing. No `secrets:` input, no token in `env:`, no
  # registry login — if the build ever needs a credential again, it fails here,
  # on the pull request that introduced it, rather than on a newcomer's laptop.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the platform image with no credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Keeps the repeat cost of this gate low enough to run on every PR.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Supply chain: dependency audit + SBOM (launch-readiness §2) ──────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Export locked requirements (SBOM input)
        run: |
          uv sync --all-packages
          uv export --all-packages --no-emit-workspace --no-hashes > requirements-sbom.txt
      - name: pip-audit
        run: uvx pip-audit -r requirements-sbom.txt --skip-editable
      - name: Upload SBOM (requirements export)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-requirements
          path: requirements-sbom.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: pnpm audit (prod deps)
        working-directory: frontend
        run: pnpm audit --prod

  # ── Deploy gate: build the real images, bring the stack up, smoke the origin ─
  # Runs on the deploy path (push to main) and on demand — not on every PR, since
  # booting the whole stack is heavy. The part a PR must not break — that the
  # image builds with no credentials at all — is the `quickstart` job above,
  # which runs on every PR.
  # The self-hosted install the README promises, actually installed. Without
  # this the instructions are a claim: deploy/self-hosted is a second compose
  # that no job ran, so the first person to follow it would be the one who finds
  # out it drifted from the images, the env names or the identity flag.
  #
  # Caddy is the one thing swapped out: ACME needs a public hostname, which a
  # runner has not got. The frontend is published directly instead, which is the
  # same origin the SPA and /identity are served on behind Caddy in production.
  self-hosted:
    runs-on: ubuntu-latest
    needs: [python]
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: deploy/self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Override — build from this checkout, no Caddy, frontend published
        run: |
          cat > ci-override.yml <<'OVR'
          services:
            backend:  {build: {context: ../..}}
            identity: {build: {context: ../..}, image: axor-ci-identity}
            proxy:    {build: {context: ../..}}
            frontend:
              build: {context: ../.., dockerfile: frontend/Dockerfile}
              ports: ["8080:8080"]
            caddy: {profiles: ["never"]}
          OVR

      # .env has to exist before ANY compose command: the compose file declares
      # its required values as ${VAR:?...}, so even `config` fails without it.
      # The signing key is seeded with a placeholder and replaced below with one
      # the image generates — that call is bootstrap.sh's, and it cannot run
      # before the image exists.
      - name: Seed .env so compose can interpolate
        run: |
          set -eu
          sed \
            -e "s|^CP_HOST=.*|CP_HOST=localhost|" \
            -e "s|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.com|" \
            -e "s|^AXOR_PG_PASSWORD=.*|AXOR_PG_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^AXOR_API_TOKEN=.*|AXOR_API_TOKEN=$(openssl rand -hex 24)|" \
            -e "s|^AXOR_PROXY_TOKEN=.*|AXOR_PROXY_TOKEN=$(openssl rand -hex 24)|" \
            -e "s|^AXOR_IDENTITY_SIGNING_KEY=.*|AXOR_IDENTITY_SIGNING_KEY=seed|" \
            .env.example > .env
          docker compose -f docker-compose.yml -f ci-override.yml config >/dev/null

      - name: Build
        run: docker compose -f docker-compose.yml -f ci-override.yml build

      # The step most likely to rot if that module moves, so it runs the real
      # call against the real image rather than a local import.
      - name: Signing key, generated with the image as bootstrap.sh does
        run: |
          set -eu
          PEM=$(docker run --rm --entrypoint python axor-ci-identity \
            -c "from axor_identity.keys import generate_pem; print(generate_pem())")
          sed -i "/^AXOR_IDENTITY_SIGNING_KEY=/d" .env
          printf 'AXOR_IDENTITY_SIGNING_KEY="%s"\n' "$PEM" >> .env
          # An empty AXOR_API_TOKEN silently turns auth off. On a public
          # hostname that is the one failure this file must never ship with.
          for v in CP_HOST AXOR_PG_PASSWORD AXOR_API_TOKEN AXOR_PROXY_TOKEN \
                   AXOR_IDENTITY_SIGNING_KEY; do
            grep -qE "^$v=.+" .env || { echo "$v is empty in .env"; exit 1; }
          done
          grep -qE '^AXOR_IDENTITY_SIGNUP=first-only$' .env

      - name: Start it
        run: docker compose -f docker-compose.yml -f ci-override.yml up -d

      - name: Wait for health
        run: |
          set -e
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && { echo up; break; }
            [ "$i" = "90" ] && { echo TIMEOUT; exit 1; }
            sleep 2
          done

      - name: The single-tenant promise holds
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -qi "<!doctype html"

          # identity is reachable at /identity on the same origin, and says
          # whether it is still accepting an account.
          mode=$(curl -fsS http://localhost:8080/identity/v1/signup-mode)
          echo "$mode" | grep -q '"mode":"first-only"'
          echo "$mode" | grep -q '"available":true'

          # The first account claims the install...
          curl -fsS -X POST http://localhost:8080/identity/v1/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@example.com","password":"correct horse battery","org_name":"Acme"}' \
            | grep -q '"role":"owner"'

          # ...and the next stranger is refused. That is the whole point: a
          # public hostname that is not a public sign-up page.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/identity/v1/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"stranger@example.com","password":"correct horse battery","org_name":"Theirs"}')
          [ "$code" = "403" ] || { echo "second signup returned $code, expected 403"; exit 1; }

          # Closing signup did not close the install: the owner still logs in.
          curl -fsS -X POST http://localhost:8080/identity/v1/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@example.com","password":"correct horse battery"}' \
            | grep -q access_token

          echo "self-hosted smoke OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f ci-override.yml logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f ci-override.yml down -v || true

  deploy:
    runs-on: ubuntu-latest
    needs: [python, frontend-e2e, quickstart]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: echo "AXOR_PG_PASSWORD=ci-postgres-pass" > .env
      # No credentials in this step's environment, on purpose: the images must
      # build from a bare checkout exactly as they do for someone who just
      # cloned the repository.
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          set -e
          for svc in \
            "http://localhost:8402/v1/healthz" \
            "http://localhost:8400/v1/healthz" \
            "http://localhost:8401/axor/healthz" \
            "http://localhost:8080/"; do
            echo "waiting for $svc"
            for i in $(seq 1 60); do
              if curl -fsS "$svc" >/dev/null 2>&1; then echo "  up"; break; fi
              if [ "$i" = "60" ]; then echo "  TIMEOUT"; exit 1; fi
              sleep 2
            done
          done
      - name: Smoke the deployed single origin (:8080 proxies /v1 and /axor)
        run: |
          set -e
          # The SPA is served…
          curl -fsS http://localhost:8080/ | grep -qi "<!doctype html" || { echo "SPA not served"; exit 1; }
          # …and the API answers through the nginx reverse proxy, on Postgres.
          curl -fsS http://localhost:8080/axor/healthz | grep -q '"ok":true'
          seeded=$(curl -fsS -X POST http://localhost:8080/v1/demo/seed-adapter-runs)
          echo "$seeded" | grep -q "ex_block"
          # A deterministic replay reproduces the recorded deny (0 divergence) —
          # the deployed backend really replays through the kernel, on Postgres.
          rep=$(curl -fsS http://localhost:8080/v1/replay/ex_block)
          echo "$rep" | grep -q '"first_divergence":null'
          echo "deploy smoke OK"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
