name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run when a new axor-core is published: the backend, proxy and the
  # ecosystem deps resolve against it, so a release can change the stack.
  # axor-core's publish job fans this out.
  repository_dispatch:
    types: [axor-core-published]
  workflow_dispatch:

jobs:
  # ── Python: lint + unit + backend E2E (real backend/proxy subprocesses) ──────
  python:
    runs-on: ubuntu-latest
    # The suite runs on SQLite; production runs on Postgres. Until this service
    # existed the only thing that ever touched Postgres was the deploy job's
    # three-route smoke, which does not run on pull requests — so the second
    # dialect was a claim, and the first thing it cost was a migration that
    # passed every test and could not be applied to the production database at
    # all (Postgres does not rename a table's constraints when the table is
    # renamed; SQLite has no such rule). `-m postgres` closes that gap.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: axor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXOR_TEST_POSTGRES_URL: postgresql+asyncpg://axor:ci@127.0.0.1:5432/axor_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # No "Authorize ecosystem git deps" step: pyproject's [tool.uv.sources]
      # says the git-ref era is over — every ecosystem dependency resolves from
      # PyPI and `uv.lock` holds zero git sources. The step it replaced wrote a
      # global `insteadOf` rewrite with a PAT on every job, for dependencies
      # that no longer exist. The Dockerfile's build-time secret was left in
      # place at the time, as a no-op "conditional on the secret being present"
      # — except compose declared it required, so the no-op was the quickstart's
      # first command asking a stranger for a PAT. It is gone now, and the
      # `quickstart` job below keeps it gone.
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      # `pytest` collects the backend E2E suite too — it boots the real backend
      # and proxy as subprocesses (marker `e2e`). Run it explicitly first so a
      # failure there is legible, then the whole suite.
      - name: Backend E2E
        run: uv run pytest -q -m e2e
      # Named separately so a dialect failure is legible as one, rather than
      # arriving inside a 300-test run.
      - name: Postgres dialect
        run: uv run pytest -q -m postgres
      - name: Tests
        run: uv run pytest -q

  # ── Frontend: typecheck + build + Playwright E2E (boots the whole stack) ─────
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # The Playwright webServer boots the real backend + proxy (`uv run`), so
      # the Python workspace must be installed.
      - name: Sync workspace
        run: uv sync --all-packages
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # `pnpm build` runs `tsc -b` first, so a type error fails the job here.
      - name: Typecheck + build
        working-directory: frontend
        run: pnpm build
      - name: Playwright E2E
        working-directory: frontend
        run: pnpm e2e
        env:
          CI: "1"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ── Quickstart: the stranger's build, with nothing in the environment ───────
  # The one thing a PR may never reintroduce. The ecosystem deps were private
  # git refs once; when they moved to PyPI the Dockerfile's `github_token`
  # BuildKit secret stayed behind, and the quickstart of a public repository
  # went on demanding a PAT only the owner could issue. It stayed green the
  # whole time, because the one job that built an image was handed a token.
  #
  # This job is handed nothing. No `secrets:` input, no token in `env:`, no
  # registry login — if the build ever needs a credential again, it fails here,
  # on the pull request that introduced it, rather than on a newcomer's laptop.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the platform image with no credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Keeps the repeat cost of this gate low enough to run on every PR.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Supply chain: dependency audit + SBOM (launch-readiness §2) ──────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Export locked requirements (SBOM input)
        run: |
          uv sync --all-packages
          uv export --all-packages --no-emit-workspace --no-hashes > requirements-sbom.txt
      - name: pip-audit
        run: uvx pip-audit -r requirements-sbom.txt --skip-editable
      - name: Upload SBOM (requirements export)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-requirements
          path: requirements-sbom.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: pnpm audit (prod deps)
        working-directory: frontend
        run: pnpm audit --prod

  # ── Deploy gate: build the real images, bring the stack up, smoke the origin ─
  # Runs on the deploy path (push to main) and on demand — not on every PR, since
  # booting the whole stack is heavy. The part a PR must not break — that the
  # image builds with no credentials at all — is the `quickstart` job above,
  # which runs on every PR.
  deploy:
    runs-on: ubuntu-latest
    needs: [python, frontend-e2e, quickstart]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: echo "AXOR_PG_PASSWORD=ci-postgres-pass" > .env
      # No credentials in this step's environment, on purpose: the images must
      # build from a bare checkout exactly as they do for someone who just
      # cloned the repository.
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          set -e
          for svc in \
            "http://localhost:8402/v1/healthz" \
            "http://localhost:8400/v1/healthz" \
            "http://localhost:8401/axor/healthz" \
            "http://localhost:8080/"; do
            echo "waiting for $svc"
            for i in $(seq 1 60); do
              if curl -fsS "$svc" >/dev/null 2>&1; then echo "  up"; break; fi
              if [ "$i" = "60" ]; then echo "  TIMEOUT"; exit 1; fi
              sleep 2
            done
          done
      - name: Smoke the deployed single origin (:8080 proxies /v1 and /axor)
        run: |
          set -e
          # The SPA is served…
          curl -fsS http://localhost:8080/ | grep -qi "<!doctype html" || { echo "SPA not served"; exit 1; }
          # …and the API answers through the nginx reverse proxy, on Postgres.
          curl -fsS http://localhost:8080/axor/healthz | grep -q '"ok":true'
          seeded=$(curl -fsS -X POST http://localhost:8080/v1/demo/seed-adapter-runs)
          echo "$seeded" | grep -q "ex_block"
          # A deterministic replay reproduces the recorded deny (0 divergence) —
          # the deployed backend really replays through the kernel, on Postgres.
          rep=$(curl -fsS http://localhost:8080/v1/replay/ex_block)
          echo "$rep" | grep -q '"first_divergence":null'
          echo "deploy smoke OK"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
