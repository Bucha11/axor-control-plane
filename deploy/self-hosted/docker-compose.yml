# Self-hosted Axor Control Plane — one company, one host, one command.
#
#   ./bootstrap.sh axor.example.com you@example.com
#
# Six services. Caddy is the only one with published ports; it obtains and
# renews Let's Encrypt certificates on its own.
#
# Axor Lab is optional: `./bootstrap.sh <host> <email> --with-lab` turns on the
# `lab` profile (two more services, `lab` and `lab-edge`) on its own hostname.
# It signs people in through THIS stack's identity service, so the same account
# works in both products, and it offers no anonymous guests — a company install
# is private.
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    environment:
      CP_HOST: ${CP_HOST:?set CP_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      LAB_HOST: ${LAB_HOST:-}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # extra sites: bootstrap.sh writes sites/lab.caddy when Lab is enabled
    - ./sites:/etc/caddy/sites:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
    - frontend
    logging: *id001
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axor
      POSTGRES_USER: axor
      POSTGRES_PASSWORD: ${AXOR_PG_PASSWORD:?set AXOR_PG_PASSWORD in .env}
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ../initdb/10-identity-db.sql:/docker-entrypoint-initdb.d/10-identity-db.sql:ro
    # Lab's database. Runs only on a fresh volume; bootstrap.sh creates it on an
    # existing one when Lab is enabled later.
    - ../prod/initdb/20-lab-db.sql:/docker-entrypoint-initdb.d/20-lab-db.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U axor -d axor
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *id001
  backend:
    image: ${AXOR_IMAGE:-ghcr.io/bucha11/axor-platform}:${AXOR_TAG:-latest}
    restart: unless-stopped
    command:
    - uvicorn
    - axor_backend.main:app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '8400'
    expose:
    - '8400'
    environment:
      AXOR_DATABASE_URL: postgresql+asyncpg://axor:${AXOR_PG_PASSWORD}@postgres/axor
      AXOR_API_TOKEN: ${AXOR_API_TOKEN:?set AXOR_API_TOKEN in .env}
      AXOR_ALLOW_UNSIGNED: ${AXOR_ALLOW_UNSIGNED:-0}
      AXOR_OPERATOR_KEYS: ${AXOR_OPERATOR_KEYS:-{}}
      AXOR_VENDOR_PUBKEY: ${AXOR_VENDOR_PUBKEY:-}
      AXOR_ORG: ${AXOR_ORG:-}
      AXOR_VAULT_CREDS_TOKEN: ${AXOR_VAULT_CREDS_TOKEN:-}
      AXOR_VAULT_SIGNING_TOKEN: ${AXOR_VAULT_SIGNING_TOKEN:-}
      AXOR_IDENTITY_JWKS_URL: http://identity:8402/.well-known/jwks.json
      AXOR_LOG_JSON: ${AXOR_LOG_JSON:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8400/v1/healthz').status==200
        else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *id001
  identity:
    image: ${AXOR_IMAGE:-ghcr.io/bucha11/axor-platform}:${AXOR_TAG:-latest}
    restart: unless-stopped
    command:
    - axor-identity
    expose:
    - '8402'
    environment:
      AXOR_IDENTITY_HOST: 0.0.0.0
      AXOR_IDENTITY_PORT: '8402'
      AXOR_IDENTITY_DATABASE_URL: postgresql+asyncpg://axor:${AXOR_PG_PASSWORD}@postgres/axor_identity
      AXOR_IDENTITY_SIGNING_KEY: ${AXOR_IDENTITY_SIGNING_KEY:?set AXOR_IDENTITY_SIGNING_KEY in .env}
      AXOR_IDENTITY_SIGNUP: ${AXOR_IDENTITY_SIGNUP:-open}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8402/v1/healthz').status==200
        else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *id001
  proxy:
    image: ${AXOR_IMAGE:-ghcr.io/bucha11/axor-platform}:${AXOR_TAG:-latest}
    restart: unless-stopped
    command:
    - axor-proxy
    expose:
    - '8401'
    environment:
      AXOR_PROXY_HOST: 0.0.0.0
      AXOR_PROXY_PORT: '8401'
      AXOR_PROXY_DEMO: ${AXOR_PROXY_DEMO:-1}
      AXOR_PROXY_TOKEN: ${AXOR_PROXY_TOKEN:?set AXOR_PROXY_TOKEN in .env}
      AXOR_TRACE_DIR: /data/traces
      AXOR_BACKEND_URL: http://backend:8400
      AXOR_INGEST_KEY: ${AXOR_INGEST_KEY:-}
    volumes:
    - axordata:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8401/axor/healthz').status==200
        else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *id001
  frontend:
    image: ${AXOR_FRONTEND_IMAGE:-ghcr.io/bucha11/axor-frontend}:${AXOR_TAG:-latest}
    restart: unless-stopped
    expose:
    - '8080'
    environment:
      AXOR_PROXY_TOKEN: ${AXOR_PROXY_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
      identity:
        condition: service_healthy
      proxy:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *id001
  # ── Axor Lab (profile `lab`) ──────────────────────────────────────────────
  # One process holds live run state in memory: never scale to 2 replicas.
  lab:
    profiles: ["lab"]
    image: ${LAB_IMAGE:-ghcr.io/bucha11/axor-lab}:${LAB_TAG:-edge}
    restart: unless-stopped
    expose: ["8871"]
    environment:
      # gates every screen endpoint; people never see it — they sign in with
      # their Control Plane account through the identity service below
      AXOR_LAB_CONTROL_TOKEN: ${AXOR_LAB_CONTROL_TOKEN:?set AXOR_LAB_CONTROL_TOKEN in .env (bootstrap.sh --with-lab)}
      AXOR_LAB_DATABASE_URL: postgresql://axor:${AXOR_PG_PASSWORD}@postgres/axor_lab
      AXOR_LAB_DATA_DIR: /data
      AXOR_LAB_IDENTITY_JWKS_URL: http://identity:8402/.well-known/jwks.json
      AXOR_LAB_IDENTITY_ISSUER: axor-identity
      # a company install is private: no anonymous trial workspaces
      AXOR_LAB_GUEST_SESSIONS: ${AXOR_LAB_GUEST_SESSIONS:-0}
    volumes: ["labdata:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8871/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *id001
  # rate limits Lab and serves /identity on Lab's hostname — the same edge the
  # hosted deployment runs (deploy/prod/lab-nginx.conf)
  lab-edge:
    profiles: ["lab"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose: ["8080"]
    volumes:
    - ../prod/lab-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lab: {condition: service_healthy}
      identity: {condition: service_healthy}
    logging: *id001
volumes:
  pgdata: {}
  labdata: {}
  axordata: {}
  caddy_data: {}
  caddy_config: {}
