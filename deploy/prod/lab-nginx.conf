# Edge for Axor Lab behind Caddy. Adapted from axor-lab's deploy/nginx.conf:
# rate limits by client IP, SSE without buffering, and /identity mounted beside
# the Lab so the Lab web app's login (VITE_IDENTITY_URL defaults to /identity)
# stays on one origin.

# Caddy is the only thing that reaches this server (it publishes no port), and
# Caddy REPLACES X-Forwarded-For with the peer address rather than appending a
# client-supplied value, so the last address in the header is the real client.
# Without this every request would come from Caddy's IP and share one bucket.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=guest:1m  rate=6r/m;
limit_req_zone $binary_remote_addr zone=login:1m  rate=10r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conns:10m;

upstream lab {
    server lab:8871;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 64m;   # a bundle upload is the large request here
    limit_conn conns 64;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Live-run event stream: buffering would freeze it in the browser.
    location ~ ^/runs/[^/]+/events$ {
        proxy_pass http://lab;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        limit_req zone=api burst=40 nodelay;
    }

    # The one route where an anonymous stranger can mint resources.
    location = /guest-session {
        limit_req zone=guest burst=3 nodelay;
        proxy_pass http://lab;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # axor-identity (shared with the Control Plane). The trailing slash strips
    # the /identity prefix. Login and signup are password endpoints, so they
    # get a tight bucket against credential stuffing.
    location ~ ^/identity/v1/(login|signup) {
        limit_req zone=login burst=5 nodelay;
        rewrite ^/identity/(.*)$ /$1 break;
        proxy_pass http://identity:8402;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /identity/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://identity:8402/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://lab;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # A run assignment or a bundle upload can outlast the default 60s.
        proxy_read_timeout 300s;
    }
}
