# Self-hosted deployment — the whole stack with one command:
#
#   cp .env.example .env      # set AXOR_PG_PASSWORD (and GITHUB_TOKEN to build)
#   docker compose up --build
#
# Then open http://localhost:8080 — the frontend reverse-proxies the backend and
# proxy, so the browser talks to a single origin. Kùzu is embedded (no container).
#
# The backend + proxy share one image (built from ./Dockerfile, the uv
# workspace); the frontend is an nginx image serving the built SPA. The private
# ecosystem deps (axor-core / axor-eval) are fetched at build time via the
# github_token secret — see ./Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axor
      POSTGRES_USER: axor
      POSTGRES_PASSWORD: ${AXOR_PG_PASSWORD:?set AXOR_PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # create the identity service's own database on first init (its schema and
      # alembic history are separate from the backend's — one DB, two apps, would
      # collide on alembic_version)
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axor -d axor"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [github_token]
    command: ["uvicorn", "axor_backend.main:app", "--factory", "--host", "0.0.0.0", "--port", "8400"]
    environment:
      AXOR_DATABASE_URL: postgresql+asyncpg://axor:${AXOR_PG_PASSWORD}@postgres/axor
      # The taint graph is a derived index over the persisted event log — the
      # backend rebuilds it from Postgres at boot (no graph DB). A per-tenant
      # embedded Kùzu store is available for hosted; it is not wired by default.
      # Dev convenience: the UI sends unsigned plane commands. For a real
      # deployment set AXOR_OPERATOR_KEYS (JSON op->pubkey) and drop this.
      AXOR_ALLOW_UNSIGNED: ${AXOR_ALLOW_UNSIGNED:-1}
      AXOR_OPERATOR_KEYS: ${AXOR_OPERATOR_KEYS:-{}}
      AXOR_VENDOR_PUBKEY: ${AXOR_VENDOR_PUBKEY:-}
      # Separate credential per vault subsystem (spec v2 Ch.5 §3). Empty leaves
      # the wall down — the backend warns about it at startup.
      AXOR_VAULT_CREDS_TOKEN: ${AXOR_VAULT_CREDS_TOKEN:-}
      AXOR_VAULT_SIGNING_TOKEN: ${AXOR_VAULT_SIGNING_TOKEN:-}
      # Auth (architecture section 9): empty = open (dev). Set to require a token.
      AXOR_API_TOKEN: ${AXOR_API_TOKEN:-}
      # axor-identity login: the backend verifies human access tokens against the
      # identity service's JWKS, fetched once at boot. Point elsewhere or clear it
      # to run without identity login (operator token + API keys still work).
      AXOR_IDENTITY_JWKS_URL: ${AXOR_IDENTITY_JWKS_URL:-http://identity:8402/.well-known/jwks.json}
    ports: ["8400:8400"]
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8400/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [github_token]
    command: ["axor-identity"]
    environment:
      AXOR_IDENTITY_HOST: 0.0.0.0
      AXOR_IDENTITY_PORT: "8402"
      AXOR_IDENTITY_DATABASE_URL: postgresql+asyncpg://axor:${AXOR_PG_PASSWORD}@postgres/axor_identity
      # Stable EdDSA signing key (PKCS#8 PEM). Empty = a throwaway key generated
      # at boot — DEV ONLY: tokens die on restart and the backend's cached JWKS
      # goes stale. Generate one:
      #   python -c "from axor_identity.keys import generate_pem; print(generate_pem())"
      AXOR_IDENTITY_SIGNING_KEY: ${AXOR_IDENTITY_SIGNING_KEY:-}
    ports: ["8402:8402"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8402/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [github_token]
    command: ["axor-proxy"]
    environment:
      AXOR_PROXY_HOST: 0.0.0.0
      AXOR_PROXY_PORT: "8401"
      AXOR_PROXY_DEMO: ${AXOR_PROXY_DEMO:-1}   # demo mock tools by default
      # The control surface arms runs, injects faults into live tool traffic and
      # reads back traces — and this service publishes its port. Empty keeps the
      # historical open posture; set it for anything beyond a local bench.
      AXOR_PROXY_TOKEN: ${AXOR_PROXY_TOKEN:-}
      AXOR_TRACE_DIR: /data/traces
      AXOR_BACKEND_URL: http://backend:8400    # auto-upload runs on claim
      AXOR_INGEST_KEY: ${AXOR_INGEST_KEY:-}    # scoped key for upload when auth is on
    volumes: ["axordata:/data"]
    ports: ["8401:8401"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8401/axor/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Stripe payment link for the Pricing CTA; empty = mailto fallback.
        VITE_CHECKOUT_URL: ${VITE_CHECKOUT_URL:-}
    ports: ["8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
      proxy:
        condition: service_started
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
  axordata: {}

# Optional git token for building the private ecosystem deps, from the
# GITHUB_TOKEN env var; an empty value builds fine in networks that already reach
# the repos.
secrets:
  github_token:
    environment: GITHUB_TOKEN
