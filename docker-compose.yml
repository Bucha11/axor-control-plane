# Self-hosted deployment — the whole stack with one command:
#
#   cp .env.example .env      # set AXOR_PG_PASSWORD (and GITHUB_TOKEN to build)
#   docker compose up --build
#
# Then open http://localhost:8080 — the frontend reverse-proxies the backend and
# proxy, so the browser talks to a single origin. Kùzu is embedded (no container).
#
# The backend + proxy share one image (built from ./Dockerfile, the uv
# workspace); the frontend is an nginx image serving the built SPA. The private
# ecosystem deps (axor-core / axor-eval) are fetched at build time via the
# github_token secret — see ./Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axor
      POSTGRES_USER: axor
      POSTGRES_PASSWORD: ${AXOR_PG_PASSWORD:?set AXOR_PG_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axor -d axor"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [github_token]
    command: ["uvicorn", "axor_backend.main:app", "--factory", "--host", "0.0.0.0", "--port", "8400"]
    environment:
      AXOR_DATABASE_URL: postgresql+asyncpg://axor:${AXOR_PG_PASSWORD}@postgres/axor
      AXOR_GRAPH_DIR: /data/graph
      AXOR_TRACE_DIR: /data/traces
      # Dev convenience: the UI sends unsigned plane commands. For a real
      # deployment set AXOR_OPERATOR_KEYS (JSON op->pubkey) and drop this.
      AXOR_ALLOW_UNSIGNED: ${AXOR_ALLOW_UNSIGNED:-1}
      AXOR_OPERATOR_KEYS: ${AXOR_OPERATOR_KEYS:-{}}
      AXOR_VENDOR_PUBKEY: ${AXOR_VENDOR_PUBKEY:-}
      # Auth (architecture section 9): empty = open (dev). Set to require a token.
      AXOR_API_TOKEN: ${AXOR_API_TOKEN:-}
    volumes: ["axordata:/data"]
    ports: ["8400:8400"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8400/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [github_token]
    command: ["axor-proxy"]
    environment:
      AXOR_PROXY_HOST: 0.0.0.0
      AXOR_PROXY_PORT: "8401"
      AXOR_PROXY_DEMO: ${AXOR_PROXY_DEMO:-1}   # demo mock tools by default
      AXOR_TRACE_DIR: /data/traces
      AXOR_BACKEND_URL: http://backend:8400    # auto-upload runs on claim
      AXOR_INGEST_KEY: ${AXOR_INGEST_KEY:-}    # scoped key for upload when auth is on
    volumes: ["axordata:/data"]
    ports: ["8401:8401"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8401/axor/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
  axordata: {}

# Optional git token for building the private ecosystem deps, from the
# GITHUB_TOKEN env var; an empty value builds fine in networks that already reach
# the repos.
secrets:
  github_token:
    environment: GITHUB_TOKEN
