[project]
name = "axor-control-plane"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
axor-proxy = { workspace = true }
axor-backend = { workspace = true }
# Git-ref pins (plan decision 5.1): axor-eval is not on PyPI; axor-core is pinned
# to a ref until the kernel merge ships in a release. CI/dev environments that
# cannot reach github.com directly redirect via `git config url...insteadOf`.
axor-core = { git = "https://github.com/Bucha11/axor-core", branch = "claude/design-mockups-plan-jgqwup" }
# The branch carries the <0.10 core-range widening needed for core 0.9.1;
# repoint both pins to main (or PyPI versions) once the release PRs merge.
axor-eval = { git = "https://github.com/Bucha11/axor-eval", branch = "claude/design-mockups-plan-jgqwup" }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
markers = [
  "e2e: end-to-end tests that boot the real backend/proxy as subprocesses and drive them over HTTP (slower; deselect with -m 'not e2e')",
]
