[project]
name = "axor-control-plane"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
axor-proxy = { workspace = true }
axor-backend = { workspace = true }
axor-identity = { workspace = true }
# Ecosystem deps come from PyPI (axor-core 0.10.0, axor-eval 0.1.1, axor-wrap
# 0.1.0 are published); the version ranges live in the packages' own
# dependency lists.
# The git-ref era (plan decision 5.1) is over — no tokens, no insteadOf.

[dependency-groups]
# httpx drives the ASGI test clients (backend + axor-identity suites); it is a
# test-only dep, so it lives here rather than in any package's runtime deps.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
markers = [
  "e2e: end-to-end tests that boot the real backend/proxy as subprocesses and drive them over HTTP (slower; deselect with -m 'not e2e')",
  "postgres: runs against a real Postgres (AXOR_TEST_POSTGRES_URL); skipped when it is unset. The rest of the suite is SQLite, and the dialects do differ — a migration that passed every SQLite test could not be applied to Postgres at all.",
]
